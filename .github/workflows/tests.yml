name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unittest:
    name: unittest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: Byte-compile
        run: python -m compileall -q main.py console tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
